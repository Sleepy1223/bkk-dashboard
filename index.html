<!DOCTYPE html>
<html lang="hu" class="land">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0b1220">

    <title>Otthoni BKK Dashboard</title>

    <!--
        A betűméretet a képernyőhöz igazítjuk, még az első kirajzolás előtt.
        Régi böngészőkben (Android 4.x) nincs vw / vh / clamp, ezért
        minden méret rem-ben van, a rem értékét pedig ez a pár sor adja meg.
    -->
    <script>
        (function () {
            var root = document.documentElement;

            window.bkkFit = function () {
                var w = window.innerWidth || root.clientWidth || 1024;
                var h = window.innerHeight || root.clientHeight || 552;
                var land = w > h * 1.2;
                var size = land ? Math.min(w / 64, h / 34.5) : w / 29;

                if (size < 8) { size = 8; }
                if (size > 48) { size = 48; }

                root.style.fontSize = (Math.round(size * 100) / 100) + "px";
                root.className = land ? "land" : "port";
            };

            window.bkkFit();
        })();
    </script>

    <link rel="stylesheet" href="style.css?v=3">

</head>


<body>

    <div class="app">


        <!-- =====================================
             FEJLÉC
        ====================================== -->

        <div class="header">

            <div id="time" class="clock">--:--</div>

            <div class="dateblock">
                <div id="weekday" class="weekday">&nbsp;</div>
                <div id="date" class="date">&nbsp;</div>
            </div>

            <div class="controls">

                <!-- IRÁNYVÁLTÓ -->
                <div class="switch"><button
                        type="button"
                        id="btn-in"
                        class="switch-btn is-active"
                    >Örs felé</button><button
                        type="button"
                        id="btn-out"
                        class="switch-btn"
                    >Hazafelé</button></div>

                <div class="status">
                    <span id="status-dot" class="dot"></span><span id="status-text">Betöltés…</span>
                </div>

            </div>

        </div>


        <div class="main">


            <!-- =====================================
                 KÖZLEKEDÉS
            ====================================== -->

            <div class="col col-transport">

                <!-- BUSZ -->
                <div class="slot slot-bus">
                    <div class="card">

                        <div class="card-head">
                            <span class="chip chip-bus">BUSZ</span><span
                                id="bus-from" class="from">Jókai Mór utca</span><img
                                class="arrow" alt="" data-icon="arrow"><span
                                id="bus-to" class="to">Örs vezér tere</span>
                        </div>

                        <div id="bus-departures" class="card-body">
                            <div class="note">BKK adatok betöltése…</div>
                        </div>

                    </div>
                </div>

                <!-- HÉV -->
                <div class="slot slot-hev">
                    <div class="card">

                        <div class="card-head">
                            <span class="chip chip-hev">HÉV</span><span
                                id="hev-from" class="from">Mátyásföld, repülőtér</span><img
                                class="arrow" alt="" data-icon="arrow"><span
                                id="hev-to" class="to">Örs vezér tere</span>
                        </div>

                        <div id="hev-departures" class="card-body">
                            <div class="note">BKK adatok betöltése…</div>
                        </div>

                    </div>
                </div>

            </div>


            <!-- =====================================
                 IDŐJÁRÁS + MA
            ====================================== -->

            <div class="col col-side">

                <!-- IDŐJÁRÁS -->
                <div class="slot slot-weather">
                    <div class="card">

                        <div class="card-head">
                            <span class="to">Időjárás</span><span class="from head-extra">Budapest</span>
                        </div>

                        <div class="w-main">
                            <div class="w-main-in">

                                <img id="weather-icon" class="w-icon" alt="">

                                <div class="w-line">
                                    <span id="temperature" class="w-temp">--°</span><span
                                        id="weather-range" class="w-range">--° – --°</span>
                                </div>

                                <div id="weather-description" class="w-desc">Betöltés…</div>

                            </div>
                        </div>

                        <div class="w-stats">

                            <div class="w-stat">
                                <div class="label">Eső esélye</div>
                                <div id="rain-chance" class="w-stat-value">--%</div>
                            </div>

                            <div class="w-stat">
                                <div class="label">Napkelte</div>
                                <div id="sunrise" class="w-stat-value">--:--</div>
                            </div>

                            <div class="w-stat">
                                <div class="label">Napnyugta</div>
                                <div id="sunset" class="w-stat-value">--:--</div>
                            </div>

                        </div>

                    </div>
                </div>

                <!-- MA -->
                <div class="slot slot-today">
                    <div class="card">

                        <div class="card-head">
                            <span class="to">Ma</span>
                        </div>

                        <div class="today-body">

                            <div class="today-col">
                                <div class="label">Születésnap</div>
                                <div id="birthdays" class="today-value">Betöltés…</div>
                            </div>

                            <div class="today-col">
                                <div class="label">Névnap</div>
                                <div id="namedays" class="today-value">Betöltés…</div>
                            </div>

                        </div>

                    </div>
                </div>

            </div>


        </div>


    </div>


    <script src="dashboard.js?v=3"></script>

</body>

</html>
